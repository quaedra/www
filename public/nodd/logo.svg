<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>nodd</title>
  <style>
    * { transform-box: fill-box; }
    .ball { transform-origin: 50% 100%; animation: ball 10s ease-in-out infinite; }
    .face { transform-origin: 50% 50%; animation: face 10s ease-in-out infinite; }
    .eye { transform-origin: 50% 50%; animation: blink 10s linear infinite; }
    .yes { animation: yes 10s linear infinite; }
    .no { opacity: 0; animation: no 10s linear infinite; }
    /* 10s loop: nod "yes" (0s), nod "yes" (3.5s), shake "no" (7s) */
    @keyframes face {
      0%, 3.3%, 6.6%, 35%, 38.3%, 41.6%, 70%, 78%, 100% { transform: none; }
      1.65%, 4.95%, 36.65%, 39.95% { transform: translateY(2.6px) scaleY(.86); }
      71%, 75% { transform: translateX(-2.4px) scaleX(.9); }
      73%, 77% { transform: translateX(2.4px) scaleX(.9); }
    }
    @keyframes ball {
      0%, 3.3%, 6.6%, 35%, 38.3%, 41.6%, 70%, 78%, 100% { transform: none; }
      1.65%, 4.95%, 36.65%, 39.95% { transform: scale(1.05, .94); }
      71%, 75% { transform: rotate(-6deg); }
      73%, 77% { transform: rotate(6deg); }
    }
    @keyframes blink {
      0%, 20%, 21.8%, 55%, 56.8%, 90%, 91.8%, 100% { transform: none; }
      20.9%, 55.9%, 90.9% { transform: scaleY(.1); }
    }
    @keyframes yes {
      0%, 69.5%, 79.5%, 100% { opacity: 1; }
      70%, 79% { opacity: 0; }
    }
    @keyframes no {
      0%, 69.5%, 79.5%, 100% { opacity: 0; }
      70%, 79% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ball, .face, .eye, .yes, .no { animation: none; }
    }
  </style>
  <g class="ball">
    <circle cx="16" cy="16" r="14" fill="#00e"/>
    <g class="face">
      <ellipse class="eye" cx="11.6" cy="14.5" rx="1.8" ry="2.4" fill="#fff"/>
      <ellipse class="eye" cx="20.4" cy="14.5" rx="1.8" ry="2.4" fill="#fff"/>
      <path class="yes" d="M13.4 19.4q2.6 2.4 5.2 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <path class="no" d="M13.6 20.6q2.4-1.8 4.8 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
